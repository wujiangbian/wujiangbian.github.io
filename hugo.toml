baseURL = "https://wujiangbian.github.io/"
languageCode = "zh-cn"
title = "wujiangbian 的博客"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[params]
  env = "production"
  description = "wujiangbian 的个人博客"
  author = "wujiangbian"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.assets]
    favicon = "/avatar.jpg"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.profileMode]
    enabled = true
    title = "wujiangbian"
    subtitle = "博客重建中，文章会陆续搬回来。"
    imageUrl = "/avatar.jpg"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "wujiangbian 的头像"
    [[params.profileMode.buttons]]
      name = "归档"
      url = "/archives/"
    [[params.profileMode.buttons]]
      name = "搜索"
      url = "/search/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wujiangbian"
  [[params.socialIcons]]
    name = "neodb"
    title = "NeoDB"
    url = "https://neodb.social/users/wujiangbian/"

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

