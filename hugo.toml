baseURL = "https://wujiangbian.github.io/"
languageCode = "zh-cn"
title = "wujiangbian 的博客"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[params]
  env = "production"
  description = "wujiangbian 的个人博客"
  author = "wujiangbian"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "你好，我是 wujiangbian"
    Content = "博客重建中，文章会陆续搬回来。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wujiangbian"

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
